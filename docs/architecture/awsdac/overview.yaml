# Source: infra/envs/aws-prod; production configuration without an EKS ALB ARN.
Diagram:
  DefinitionFiles:
    - Type: URL
      Url: https://raw.githubusercontent.com/awslabs/diagram-as-code/v0.24/definitions/definition-for-aws-icons-light.yaml

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Font: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
      Title: PetClinic 운영 토폴로지 · EKS ALB 연결 대기
      TitleColor: rgba(24,48,71,255)
      Direction: vertical
      Align: center
      Children: [Ingress, IndependentResources, Scope]

    Ingress:
      Type: AWS::Diagram::HorizontalStack
      Children: [ViewerAndTls, GlobalEdge, SeoulIngress]
    ViewerAndTls:
      Type: AWS::Diagram::VerticalStack
      Children: [Client, NorthVirginia]
    Client:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: 사용자
    NorthVirginia:
      Type: AWS::Region
      Title: 버지니아 북부 · us-east-1
      Children: [ViewerCertificate]
    ViewerCertificate:
      Type: AWS::Diagram::Resource
      Preset: AWS Certificate Manager (ACM)
      Title: |-
        CloudFront용 ACM 인증서
        mission-critical.site · 발급 완료
    GlobalEdge:
      Type: AWS::Diagram::Resource
      Title: 글로벌 서비스
      BorderColor: rgba(95,116,136,255)
      Direction: vertical
      Children: [HostedZone, Distribution]
    HostedZone:
      Type: AWS::Route53::HostedZone
      Title: |-
        Route 53 · mission-critical.site
        ACM 검증 CNAME
        A·AAAA → CloudFront
    Distribution:
      Type: AWS::CloudFront
      Title: |-
        CloudFront 배포
        비활성 · EKS ALB 대기
      TitleColor: rgba(153,80,12,255)

    SeoulIngress:
      Type: AWS::Region
      Title: 서울 · ap-northeast-2
      Children: [VpcOrigin, ServiceVpc]
    VpcOrigin:
      Type: AWS::CloudFront
      Title: |-
        VPC Origin · 연결 예정
        새 ALB로 HTTP 80
    ServiceVpc:
      Type: AWS::EC2::VPC
      Title: 서비스 VPC · 10.10.0.0/22
      Children: [InternalAlb, AppRules]
    InternalAlb:
      Type: AWS::ElasticLoadBalancingV2::LoadBalancer
      Preset: Application Load Balancer
      Title: |-
        EKS Ingress 내부 ALB
        EKS 담당자 생성 예정
    AppRules:
      Type: AWS::Diagram::Resource
      Title: EKS에서 관리할 앱 라우팅
      Direction: vertical
      BorderColor: rgba(174,113,36,255)
      BorderType: dashed
      Children: [ApiTargets, WebTargets]
    ApiTargets:
      Type: AWS::Diagram::Resource
      Title: |-
        API 백엔드
    WebTargets:
      Type: AWS::Diagram::Resource
      Title: |-
        웹 백엔드

    IndependentResources:
      Type: AWS::Diagram::HorizontalStack
      Align: center
      Children: [ManagementVpc, OsakaRegion, SsmRole]
    ManagementVpc:
      Type: AWS::EC2::VPC
      Title: 서울 관리 VPC · 10.20.0.0/24
      Children: [ManagementSubnet]
    ManagementSubnet:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: |-
        관리 서브넷 · 2a
        10.20.0.0/27
        local 경로 · EC2 없음
    OsakaRegion:
      Type: AWS::Region
      Title: 오사카 · ap-northeast-3
      Children: [OsakaVpc, StateBucket]
    OsakaVpc:
      Type: AWS::EC2::VPC
      Title: 관제 VPC · 10.40.0.0/16
      Children: [OsakaSubnet]
    OsakaSubnet:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: |-
        관제 서브넷 · 3b
        10.40.0.0/27
        IGW·EC2 없음 · local 경로
    StateBucket:
      Type: AWS::S3::Bucket
      Title: |-
        Terraform state
        aws-prod · S3 파일 잠금
    SsmRole:
      Type: AWS::IAM::Role
      Title: |-
        오사카 SSM용 IAM
        역할 · 정책 · 인스턴스 프로필
        접속 대상 없음
    Scope:
      Type: AWS::Diagram::Resource
      Title: |-
        파란 점선은 TLS 인증서 참조 · 주황색 점선은 EKS ALB 연결 후의 요청 경로
        서울–오사카 피어링 없음 · EKS·DB는 별도 담당 · Azure DR은 10.30.0.0/24 주소 예약

  Links:
    - Source: Client
      SourcePosition: E
      Target: HostedZone
      TargetPosition: W
      Type: orthogonal
      TargetArrowHead: {Type: Open}
      Labels: {TargetLeft: {Title: DNS}}
    - Source: Client
      SourcePosition: ESE
      Target: Distribution
      TargetPosition: WNW
      Type: orthogonal
      LineStyle: dashed
      LineColor: rgba(174,113,36,255)
      TargetArrowHead: {Type: Open}
      Labels: {TargetLeft: {Title: HTTPS}}
    - Source: ViewerCertificate
      SourcePosition: E
      Target: Distribution
      TargetPosition: WSW
      LineColor: rgba(49,97,155,255)
      LineStyle: dashed
      TargetArrowHead: {Type: Open}
    - Source: Distribution
      SourcePosition: E
      Target: VpcOrigin
      TargetPosition: W
      Type: orthogonal
      LineStyle: dashed
      LineColor: rgba(174,113,36,255)
      TargetArrowHead: {Type: Open}
    - Source: VpcOrigin
      SourcePosition: E
      Target: InternalAlb
      TargetPosition: W
      LineStyle: dashed
      LineColor: rgba(174,113,36,255)
      TargetArrowHead: {Type: Open}
    - Source: InternalAlb
      SourcePosition: E
      Target: AppRules
      TargetPosition: W
      TargetArrowHead: {Type: Open}
      LineStyle: dashed
      LineColor: rgba(174,113,36,255)
