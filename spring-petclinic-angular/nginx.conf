worker_processes auto;
pid /tmp/nginx.pid;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # The ingress sends this namespace to REST, never to the SPA.
        location = /petclinic/api { return 404; }
        location ^~ /petclinic/api/ { return 404; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
